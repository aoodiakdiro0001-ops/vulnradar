:root{--bg:#0a0e1a;--panel:#111830;--line:#26315a;--grn:#34d399;--red:#f87171;--org:#fb923c;--ylw:#fbbf24;--blu:#60a5fa;--cyn:#22d3ee;--txt:#dbe4f3;--mut:#8b98b8}
body{background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;color:var(--cyn)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.live{font-size:11px;font-weight:800;color:var(--grn);border:1px solid var(--grn);border-radius:12px;padding:3px 10px}
header select{margin-left:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:7px 10px;font-size:13px}
.tabs{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-bottom:none;padding:11px 18px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:800;font-size:13.5px}
.tabs button.on{background:#182246;color:var(--cyn)}
main{max-width:1100px;margin:0 auto;padding:18px 15px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:22px;display:none}
.panel.on{display:block}
.panel h2{color:var(--cyn);margin-bottom:6px;font-size:20px}
.panel p.sub{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
input[type=text],input[type=number],select,textarea{background:#0a0e1a;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:13.5px;outline:none}
input[type=text]{min-width:180px}
button.go{background:var(--cyn);color:#062a30;border:none;padding:10px 22px;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px}
button.alt{background:transparent;color:var(--blu);border:1px solid var(--blu);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13px}
button.sm{padding:6px 12px;font-size:12px}
.note{background:#182246;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--mut);margin:10px 0;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.card{background:#0a0e1a;border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:12px;padding:14px;font-size:13px}
.card.crit{border-left-color:var(--red)} .card.high{border-left-color:var(--org)} .card.med{border-left-color:var(--ylw)} .card.low{border-left-color:var(--grn)}
.card .cid{font-weight:900;font-size:14.5px;color:var(--cyn);direction:ltr;display:inline-block}
.badge{font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:10px;margin-left:8px}
.crit .badge{background:#3f1d1d;color:var(--red)} .high .badge{background:#3d2410;color:var(--org)} .med .badge{background:#3a2c10;color:var(--ylw)} .low .badge{background:#0e2a1d;color:var(--grn)} .na .badge{background:#222a44;color:var(--mut)}
.newtag{font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:10px;background:var(--grn);color:#06281c;margin-left:6px}
.card p.sum{color:var(--txt);margin:8px 0;line-height:1.6}
.card small{color:var(--mut)}
.card .refs{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.card .refs a{font-size:11.5px;color:var(--blu);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px}
table.bt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.bt th,table.bt td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.bt th{color:var(--cyn);font-size:12px}
table.bt a{color:var(--blu);font-weight:700;text-decoration:none}
.tier{color:var(--grn);font-weight:900;white-space:nowrap}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.plan{background:#0a0e1a;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.plan.hot{border-color:var(--cyn)}
.plan .amt{font-size:30px;font-weight:900;color:var(--cyn)}
.plan ul{list-style:none;font-size:13px;margin:12px 0;line-height:2;color:var(--txt)}
.plan small{color:var(--mut)}
.witem{display:flex;gap:8px;align-items:center;background:#0a0e1a;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13px}
.witem button{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px}
.adslot{max-width:1100px;margin:12px auto 0;padding:0 15px;text-align:center}
.adslot .ph{display:block;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:12px;padding:10px}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:26px 16px;border-top:1px solid var(--line);line-height:1.9}
footer a{color:var(--cyn)}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 25px;border-radius:25px;z-index:200;display:none;font-size:14px;max-width:92vw;text-align:center}
@media(max-width:640px){table.bt{font-size:12px}}
</style>

let lang='en';
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;
function setLang(v){lang=v;document.documentElement.lang=v;document.documentElement.dir=(v==='ar')?'rtl':'ltr';document.getElementById('langSel').value=v;
document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i);});
document.querySelectorAll('[data-i-ph]').forEach(e=>{e.placeholder=t(e.dataset.iPh);});
renderAll();}
function tab(w){['V','B','E','A'].forEach(k=>{document.getElementById('tab'+k).classList.toggle('on',w===k);document.getElementById('p'+k).classList.toggle('on',w===k);});}
const TG={token:'',chat:'',bot:'BaranScanBot'};/* PRIVATE deploy only: fill token+chat locally, NEVER commit secrets */
function tgSend(text){try{if(!TG.token||!TG.chat)return;fetch('https://api.telegram.org/bot'+TG.token+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG.chat,text:String(text).slice(0,3500)})}).catch(()=>{});}catch(e){}}
function tgChat(){window.open('https://t.me/'+TG.bot,'_blank');}
function toast(m){let d=document.getElementById('toast');d.textContent=m;d.style.display='block';clearTimeout(d._h);d._h=setTimeout(()=>d.style.display='none',2400);}
function sGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
async function jget(p){const r=await fetch(CIRCL+p);if(!r.ok)throw new Error('http');return r.json();}
function cvssOf(c){const v=parseFloat(c.cvss);return isNaN(v)?null:v;}
function sevOf(v){if(v==null)return 'na';if(v>=9)return 'crit';if(v>=7)return 'high';if(v>=4)return 'med';return 'low';}
function fmtD(s){try{const d=new Date((s||'').replace('T',' ').split('.')[0]+'Z');return isNaN(d)?(s||'—'):d.toLocaleDateString();}catch(e){return s||'—';}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let cache=[],seenIds=sGet('vr_seen',[]),watch=sGet('vr_watch',[]),notifOn=sGet('vr_notif',false);
function matchW(c){const s=(c.summary||'').toLowerCase();return watch.filter(w=>{w=(w||'').toLowerCase();return (c.id||'').toLowerCase()===w||(w.length>2&&s.includes(w));});}
function cardHTML(c,isNew){
const v=cvssOf(c),s=sevOf(v);
return `<div class="card ${s}"><span class="cid">${esc(c.id||'?')}</span><span class="badge">${v==null?'n/a':v.toFixed(1)}</span>${isNew?`<span class="newtag">${t('newW')}</span>`:''}<p class="sum">${esc((c.summary||'').slice(0,280))}</p><small>📅 ${fmtD(c.Published)} · ✏️ ${fmtD(c.Modified)}</small><div class="refs"><a target="_blank" rel="noopener" href="https://nvd.nist.gov/vuln/detail/${esc(c.id||'')}">NVD</a><a target="_blank" rel="noopener" href="https://cve.mitre.org/cgi-bin/cvename.cgi?name=${esc(c.id||'')}">MITRE</a><a target="_blank" rel="noopener" href="https://www.exploit-db.com/search?q=${encodeURIComponent(c.id||'')}">Exploit-DB</a></div></div>`;
}
function renderCVE(list,newIds){
newIds=newIds||{};
document.getElementById('cveGrid').innerHTML=list.length?list.map(c=>cardHTML(c,!!newIds[c.id])).join(''):`<p style="color:var(--mut)">${t('nodata')}</p>`;
document.getElementById('cntLine').textContent=list.length+' '+t('items');
}
function markSeen(list){let changed=false;list.forEach(c=>{if(c.id&&seenIds.indexOf(c.id)<0){seenIds.push(c.id);changed=true;}});if(changed)sSet('vr_seen',seenIds.slice(-600));}
function notify(title,body){try{if(notifOn&&'Notification' in window&&Notification.permission==='granted'){new Notification(title,{body:String(body).slice(0,140)});}}catch(e){}}
async function loadRecent(silent){
const v=document.getElementById('venIn').value.trim(),p=document.getElementById('proIn').value.trim();
let path='/last',fallback=null;
if(v){path='/last/'+encodeURIComponent(v)+(p?'/'+encodeURIComponent(p):'');fallback={v:v.toLowerCase(),p:p.toLowerCase()};}
try{
let list=await jget(path);
if(!Array.isArray(list))list=[];
if(fallback)list=list.filter(c=>((c.summary||'').toLowerCase().indexOf(fallback.v)>=0)&&(!fallback.p||(c.summary||'').toLowerCase().indexOf(fallback.p)>=0));
const fresh={};list.forEach(c=>{if(c.id&&seenIds.indexOf(c.id)<0) fresh[c.id]=1;});
const wasEmpty=!cache.length;
if(!wasEmpty&&Object.keys(fresh).length){
const hits=list.filter(c=>fresh[c.id]&&matchW(c).length);
if(hits.length)notify('VulnRadar: '+hits.length+' '+t('foundNew'),hits.slice(0,3).map(c=>c.id).join(', '));
}
cache=list;renderCVE(list,(!wasEmpty&&Object.keys(fresh).length)?fresh:{});markSeen(list);
document.getElementById('syncLine').textContent='✓ '+t('synced')+' '+new Date().toLocaleTimeString();
}catch(e){if(!silent){document.getElementById('cveGrid').innerHTML='<p style="color:var(--mut)">'+t('nodata')+'</p>';}}
}
async function lookupCVE(){
const id=document.getElementById('cveId').value.trim().toUpperCase();
if(!/^CVE-\d{4}-\d+$/i.test(id)){toast(t('needQ'));return;}
try{const c=await jget('/cve/'+encodeURIComponent(id));cache=[c];renderCVE([c]);markSeen([c]);}
catch(e){toast(t('nodata'));}
}
async function vendorFilter(){await loadRecent();}
function renderBounty(){
const plats=[...new Set(BOUNTY.map(b=>b.pf))],types=[...new Set(BOUNTY.map(b=>b.ty))];
const fp=document.getElementById('fPlat');
if(!fp.options.length){fp.innerHTML='<option value="">'+t('allP')+'</option>'+plats.map(p=>`<option>${p}</option>`).join('');
document.getElementById('fType').innerHTML='<option value="">'+t('allT')+'</option>'+types.map(x=>`<option>${x}</option>`).join('');}
const q=document.getElementById('fQ').value.trim().toLowerCase();
const list=BOUNTY.filter(b=>(!fp.value||b.pf===fp.value)&&(!document.getElementById('fType').value||b.ty===document.getElementById('fType').value)&&(!q||(b.n+' '+b.ty).toLowerCase().includes(q)));
document.getElementById('bountyBody').innerHTML=list.map(b=>`<tr><td><b>${b.pf}</b></td><td>${b.n}</td><td>${b.ty}</td><td class="tier">${b.tier}</td><td><a target="_blank" rel="noopener" href="${b.u}">${t('cGo')} ↗</a></td></tr>`).join('');
}
function expSearch(){
const q=document.getElementById('expQ').value.trim();
if(q.length<2){toast(t('needQ'));return;}
document.getElementById('expLinks').innerHTML=`<div class="note">“${esc(q)}” → <a target="_blank" rel="noopener" style="color:var(--blu)" href="https://www.exploit-db.com/search?q=${encodeURIComponent(q)}">Exploit-DB</a> · <a target="_blank" rel="noopener" style="color:var(--blu)" href="https://nvd.nist.gov/vuln/search/results?form_type=Basic&results_type=overview&query=${encodeURIComponent(q)}">NVD</a> · <a target="_blank" rel="noopener" style="color:var(--blu)" href="https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=${encodeURIComponent(q)}">MITRE</a></div>`;
if(/^CVE-\d{4}-\d+$/i.test(q)){jget('/cve/'+encodeURIComponent(q.toUpperCase())).then(c=>{document.getElementById('expGrid').innerHTML=cardHTML(c,false);}).catch(()=>{});}
else document.getElementById('expGrid').innerHTML='';
}
function wlAdd(){const v=document.getElementById('wlIn').value.trim();if(v.length<3){toast(t('needQ'));return;}
if(watch.map(w=>w.toLowerCase()).indexOf(v.toLowerCase())>=0){toast(t('dup'));return;}
watch.push(v);sSet('vr_watch',watch);document.getElementById('wlIn').value='';renderWL();toast(t('added'));}
function wlDel(i){watch.splice(i,1);sSet('vr_watch',watch);renderWL();}
function renderWL(){document.getElementById('wlList').innerHTML=watch.length?watch.map((w,i)=>`<div class="witem"><span>${esc(w)}</span><button onclick="wlDel(${i})">❌</button></div>`).join(''):'';}
function enableNotif(){try{if(!('Notification' in window)){toast(t('permOff'));return;}
Notification.requestPermission().then(p=>{notifOn=(p==='granted');sSet('vr_notif',notifOn);toast(notifOn?t('permOn'):t('permOff'));});}catch(e){toast(t('permOff'));}}
function testNotif(){notify(t('testT'),t('testB'));if(!notifOn)toast(t('permOff'));}
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
function exportWL(fmt2){
const rows=cache.filter(c=>matchW(c).length||!watch.length).slice(0,200);
if(fmt2==='csv'){dl(t('dlN')+'.csv','id,cvss,published,summary\n'+rows.map(c=>`"${c.id}",${cvssOf(c)==null?'':cvssOf(c)},"${c.Published||''}","${(c.summary||'').replace(/"/g,'')}")`).join('\n'),'text/csv');}
else dl(t('dlN')+'.json',JSON.stringify(rows,null,1),'application/json');
toast(t('exp'));}
function proJoin(){try{const L=sGet('vr_pro',[]);L.unshift({time:new Date().toLocaleString()});sSet('vr_pro',L);}catch(e){}try{tgSend('⭐ VulnRadar PRO interest');}catch(e){}toast(t('joined'));}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);
el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.innerHTML='';el.appendChild(s);}}
const PAY={btc:'bc1q8dhtdrndxsl70e97t8grydfe6pjue37zrhzf6c',usdt:'TLWdTjqqogkXNEXGiPWsGdjFP6ioycxeWW',name:'Baran Avisat',try:'TR10 0001 0090 1008 4013 0050 01',usd:'TR80 0001 0090 1008 4013 0050 02'};
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(x);}
function renderPayBox(){const el=document.getElementById('payBox');if(!el)return;
const row=(l,v)=>`<div style="margin:6px 0"><b>${l}:</b> <code style="direction:ltr;display:inline-block">${v}</code> <button class="alt sm" onclick="copyTxt('${v.replace(/ /g,'')}')">${t('copyB')}</button></div>`;
el.innerHTML=row('₿ BTC',PAY.btc)+row('₮ USDT-TRC20',PAY.usdt)+`<div style="margin:6px 0"><b>🏦 ${PAY.name}</b></div>`+row('TRY',PAY.try)+row('USD',PAY.usd);}
function renderAll(){renderCVE(cache);renderBounty();renderWL();renderPayBox();
document.getElementById('fPlat').innerHTML='';renderBounty();}
setLang('en');loadAds();loadRecent();setInterval(()=>loadRecent(true),CONFIG.pollMin*60000);
</script>
